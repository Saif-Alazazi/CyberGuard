<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="row">
      <div class="logo">
        <img src="icons/icon48.png" alt="" class="ico" />
        <div>
          <div class="brand">Cyber<span class="gold">Guard</span></div>
          <div class="tag">Scam message &amp; link checker</div>
        </div>
      </div>
      <button id="lang" class="lang" title="Switch language">AR</button>
    </div>
    <div class="tabs">
      <button id="tab-msg" class="tab active" data-tab="msg">Check a message</button>
      <button id="tab-page" class="tab" data-tab="page">This page</button>
    </div>
  </header>

  <main>
    <!-- Message mode -->
    <section id="pane-msg" class="pane">
      <textarea id="msg" class="msg-input" rows="4"
        placeholder="Paste a suspicious SMS, WhatsApp or email message here&#10;(e.g. a fake parcel, fine, or bank text)"></textarea>
      <button id="check-msg" class="primary">Check message</button>
    </section>

    <!-- Page mode -->
    <section id="pane-page" class="pane hidden">
      <div id="page-url" class="url"></div>
      <button id="check-page" class="primary">Re-check this page</button>
    </section>

    <div id="summary" class="summary hidden"></div>
    <div id="results" class="results"></div>
    <div id="status" class="status hidden"></div>
  </main>

  <footer>
    <span class="foot-note">Powered by the live CyberGuard engine</span>
    <a href="https://cyberguard-m7tq.onrender.com" target="_blank" class="full">Full site &rarr;</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
